name: Verify REG.RU FTPS access (read only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-regru-ftps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm FTPS login and production folder (no writes)
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, ftplib, ssl
          user = os.environ.get('REG_FTP_USER')
          password = os.environ.get('REG_FTP_PASSWORD')
          if not user or not password:
              raise RuntimeError('FTPS_SECRETS_MISSING')
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=25)
          ftp.connect('server172.hosting.reg.ru', 21)
          try:
              ftp.login(user, password)
              ftp.prot_p()
              path = ftp.pwd().rstrip('/') + '/www/xn--c1adkkdfjbp1a4l.online'
              ftp.cwd(path)
              print('REG_RU_FTPS_READ_ONLY_OK', flush=True)
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
